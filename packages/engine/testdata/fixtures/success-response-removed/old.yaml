openapi: 3.0.3
info:
  title: Items API
  version: 1.0.0
paths:
  /items/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: found
          content:
            application/json:
              schema:
                type: object
        "404":
          description: missing
